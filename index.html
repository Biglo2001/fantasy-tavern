<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d1d0b">
  <title>The Lantern &amp; Ladle — Tavern Shift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-screen" id="game-screen">
    <div class="game-stage" id="game-stage">
      <div class="scene-art" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-plaque coin-plaque"><img src="assets/icons/coin_icon_02.png" alt=""><span class="coin-count" id="coin-count">23</span></div>
      <div class="hud-plaque time-plaque"><img src="assets/icons/watch_icon_01.png" alt=""><span><strong id="day-label">Day 3</strong><small id="clock-label">12:34</small></span></div>
    </header>

    <img class="customer" id="customer" src="assets/customer_elven_woman_happy.png" alt="A cheerful elven tavern guest">
    <div class="guest-name" id="guest-name">Elowen · a regular</div>

    <section class="order-bubble" aria-label="Guest's order">
      <div class="order-items" id="order-items">
        <img src="assets/icons/potion_icon_03.png" alt="Red tonic"><span class="order-plus">+</span><img src="assets/icons/stew_icon_0.png" alt="Hearty stew">
      </div>
      <div class="order-caption" id="order-caption">Red tonic &amp; forest stew</div>
      <div class="hearts" id="hearts" aria-label="Two out of three hearts"><img src="assets/icons/red_hearth_icon.png" alt=""><img src="assets/icons/red_hearth_icon.png" alt=""><img src="assets/icons/grey_hearth_icon.png" alt=""></div>
    </section>

    <div class="work-feedback" id="work-feedback" aria-live="polite">
      <span class="feedback-mark">✦</span><span id="feedback-copy">Choose ingredients for the order</span>
    </div>

    <section class="recipe-note" id="recipe-note" aria-label="Order recipe">
      <div class="note-items"><div><img src="assets/icons/potion_icon_03.png" alt=""><span>TONIC</span></div><div><img src="assets/icons/stew_icon_0.png" alt=""><span>STEW</span></div></div>
      <div class="note-lines"><i></i><i></i><i></i></div>
    </section>

    <section class="ingredients-tray" aria-label="Choose ingredients">
      <div class="tray-label">YOUR INGREDIENTS <span id="ingredient-count">0 / 4</span></div>
      <div class="ingredient-list" id="ingredient-list"></div>
    </section>

    <div class="serve-controls">
      <button class="clear-button" id="clear-button" type="button" aria-label="Clear selected ingredients" title="Clear selection">↺</button>
      <button class="serve-button" id="serve-button" type="button" disabled><span class="button-icon" id="button-icon">✧</span><span id="button-label">Prepare order</span><span class="button-arrow">›</span></button>
    </div>

    <div class="order-result" id="order-result" hidden>
      <span class="result-spark">✦</span><strong id="result-title">A lovely result!</strong><span id="result-copy">Your guest leaves with a smile.</span>
      <button id="again-button" type="button">Another order <span>→</span></button>
    </div>
    </div>

    <div class="portrait-message"><span class="rotate-icon">▱</span><strong>Turn your device sideways</strong><small>This tavern is made for landscape.</small></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
